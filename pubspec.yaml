name: nocterm_markdown_plus
description: Themed markdown rendering for nocterm — 19 color themes with light/dark support, styled tables, task lists, and a pluggable code highlighting pipeline.
version: 0.1.0
homepage: https://github.com/AmidVoshakul/nocterm_markdown_plus
repository: https://github.com/AmidVoshakul/nocterm_markdown_plus
issue_tracker: https://github.com/AmidVoshakul/nocterm_markdown_plus/issues
topics:
  - nocterm
  - markdown
  - terminal
  - tui
  - themes

environment:
  sdk: ^3.13.4

dependencies:
  characters: ^1.3.0
  markdown: ^7.3.0
  mermaid_core: ^0.3.2
  nocterm: '>=0.9.0 <0.10.0'
  syntax_core: ^0.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
